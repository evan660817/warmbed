<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《溫床》官方玩家心測系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Serif TC', serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            overflow-x: hidden;
        }

        /* 全局背景圖 */
        .app-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('S__90570756_0.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.4);
        }

        /* 毛玻璃容器 */
        .glass-panel {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .animate-fade-in {
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        select option {
            background: #1a1a1a;
            color: white;
        }
        select { cursor: pointer; }

        .rotate-music {
            animation: spin 4s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .bar-glow {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .destiny-glow {
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;

        // Firebase ESM Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        // --- Firebase Config ---
        let app = null, auth = null, db = null;
        try {
            const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
            const firebaseConfig = typeof configStr === 'string' ? JSON.parse(configStr) : configStr;
            if (Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch (e) {
            console.warn("Firebase not configured:", e);
        }
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'warm-bed-test';

        const Icons = {
            Crown: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>,

            Skull: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 10L9.01 10"/><path d="M15 10L15.01 10"/><path d="M10 20v-3a2 2 0 0 0-4 0v3"/><path d="M18 20v-3a2 2 0 0 0-4 0v3"/><path d="M6 20h12"/><path d="M21 12a9 9 0 1 0-18 0c0 1.7.3 3.3.8 4.8.4 1.2 1.4 2.2 2.6 2.7.3.1.6.1.9.1h11.4c.3 0 .6 0 .9-.1 1.2-.5 2.2-1.5 2.6-2.7.5-1.5.8-3.1.8-4.8Z"/></svg>,
            ChevronRight: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
            Music: ({active}) => <svg className={active ? 'rotate-music' : ''} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>,
            Flame: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>,
            Eye: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
            Settings: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2l-.05.1a1 1 0 0 1-1.1.55l-1.15-.31a2 2 0 0 0-2.5 1.4l-.15.44a2 2 0 0 0 1.4 2.5l.1.05a1 1 0 0 1 .55 1.1l-.31 1.15a2 2 0 0 0 1.4 2.5l.44.15a2 2 0 0 0 2.5-1.4l.05-.1z"/><circle cx="12" cy="12" r="3"/></svg>,
            Lock: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        };

        const ALL_CHARACTERS = [
            { id: 'lyon', gender: 'male', name: '里昂', img: '里昂_0.jpg', quote: '霸道傲慢且手段狠厲的國王。畢竟真正的強者不需要犧牲主觀感受去獲取利益。' },
            { id: 'adam', gender: 'male', name: '亞當', img: '亞當_0.jpg', quote: '雙手沾滿鮮血的少年神父。靈魂底色善良，重視親情愛情卻因陰差陽錯被迫成為復仇者。' },
            { id: 'vick', gender: 'male', name: '維克', img: '維克_0.jpg', quote: '野心勃勃的虛假「拯救者」。城府極深，善於偽裝，利益至上。' },
            { id: 'daisy', gender: 'female', name: '黛西', img: '黛西_0.jpg', quote: '惡毒傲慢且野心勃勃的女皇。以玩弄人心為樂，眼中只有與自己同樣優秀的國王。' },
            { id: 'jin', gender: 'female', name: '堇', img: '堇_0.jpg', quote: '看似優柔寡斷的公主，實則是內心充滿利益算計的釣系女巫。' },
            { id: 'feiyi', gender: 'female', name: '菲伊', img: '菲伊_0.jpg', quote: '因命運坎坷而被迫成為病嬌刑訊師的可憐人。執著於沉淪墮落，在欺辱中尋求極致救贖。' },
        ];

        const QUESTIONS_MALE = [
            { type: 'multi', title: '占卜師手中的卡片令你眼花繚亂，哪些符號觸動了你的靈魂？（多選）', options: [ { text: 'A. 怪物', scores: { vick: 5, lyon: 2, adam: -3 } }, { text: 'B. 背負', scores: { adam: 5, vick: 2 } }, { text: 'C. 權力', scores: { lyon: 5, vick: -3, adam: -3 } }, { text: 'D. 強制', scores: { vick: 5, lyon: 2, adam: -3 } }, { text: 'E. 墮神', scores: { adam: 5, lyon: 2 } }, { text: 'F. 極致', scores: { lyon: 5, vick: 2, adam: -3 } }, { text: 'G. 騎士', scores: { vick: 5 } }, { text: 'H. 國王', scores: { lyon: 5 } }, { text: 'I. 王子', scores: { adam: 5 } }, { text: 'J. 壓抑', scores: { adam: 5, vick: 2, lyon: -5 } }, { text: 'K. 真心', scores: { lyon: 5, adam: 2, vick: -3 } }, { text: 'L. 利用', scores: { vick: 5 } } ] },
            { type: 'single', title: '踏入索多瑪這座墮落都市，你靈魂中最渴望駐足之處是？', options: [ { text: 'A. 繁華、名流宴會、議會席位、物欲橫流。', scores: { lyon: 10, vick: 5 } }, { text: 'B. 夕陽、教堂鐘聲、戀人低語、海誓山盟。', scores: { adam: 10, lyon: 5 } }, { text: 'C. 機會、槍與鮮血、算計背叛、掠奪佔有。', scores: { vick: 10, lyon: 5 } } ] },
            { type: 'single', title: '若將羅德家族比作一個王朝，你在這星軌上的位置是？', options: [ { text: 'A. 曾經威嚴智慧，如今難以捉摸的暴君。', scores: { lyon: 10 } }, { text: 'B. 手握重兵，野心勃勃的將軍。', scores: { vick: 10 } }, { text: 'C. 憂鬱深沈，愛上王后的王子。', scores: { adam: 10 } } ] },
            { type: 'single', title: '接受勳章時，耳畔響起的命運讖語是？', options: [ { text: 'A. 權力是強盛的階梯，野心是你的利劍。', scores: { vick: 10 } }, { text: 'B. 善良、愛、正義。保持你心中的光明。', scores: { adam: 15 } }, { text: 'C. 請隨心所欲吧，我的王，帶上你的傲慢。', scores: { lyon: 10 } } ] },
            { type: 'single', title: '發現情感糾葛錯綜複雜，你的態度是？', options: [ { text: 'A. 我完全接受，搶來的愛才有趣。', scores: { adam: 10, vick: 10 } }, { text: 'B. 我可以嘗試，只要邏輯自洽。', scores: { adam: 5, vick: 5 } }, { text: 'C. 我絕不能接受，愛必須絕對忠誠。', scores: { adam: -10, vick: -10, lyon: 10 } } ] },
            { type: 'single', title: '在決定命運的會議中，你如何展現自我？', options: [ { text: 'A. 侃侃而談，擁有極強的主導力。', scores: { lyon: 10, vick: 10 } }, { text: 'B. 保持克制，僅在必要時發聲。', scores: { adam: 10, vick: -5, lyon: -10 } } ] },
            { type: 'single', title: '愛情的種子在欲望溫床中綻放，那會是什麼花？', options: [ { text: 'A. 玫瑰花，代表純粹且無私奉獻的愛。', scores: { lyon: 10, adam: 10 } }, { text: 'B. 那是一顆麥子。花總會凋零，我要糧食。', scores: { vick: 10 } } ] },
            { type: 'single', title: '審視你的靈魂，你對愛情的最終信條是？', options: [ { text: 'A. 愛情是強者的權力，弱者只能謀取利益。', scores: { lyon: 10 } }, { text: 'B. 愛人是戰利品，先佔有，再享受。', scores: { vick: 10 } }, { text: 'C. 愛只是愛，我希望愛人永遠幸福。', scores: { adam: 15 } } ] },
            { type: 'single', title: '當末日將至，索多瑪即將毀滅，你會？', options: [ { text: 'A. 無所謂，我會給命運一個盛大的謝幕。', scores: { lyon: 10 } }, { text: 'B. 慶幸大廈將傾，真相重回人間。', scores: { adam: 10 } }, { text: 'C. 在廢墟上重建王國，生命不死權欲不衰。', scores: { vick: 10 } } ] },
            { type: 'single', title: '對你來說，血緣親情的意義是？', options: [ { text: 'A. 血緣不代表家族，我要自己選親人。', scores: { lyon: 10, vick: 10 } }, { text: 'B. 這是造物主給我的天然羈絆，是珍寶。', scores: { adam: 15 } } ] }
        ];

        const QUESTIONS_FEMALE = [
            { type: 'multi', title: '占卜師攤開卡片，哪些神秘符號與你的靈魂共鳴？（多選）', options: [ { text: 'A. 皇后', scores: { daisy: 5 } }, { text: 'B. 叛逆', scores: { feiyi: 5, jin: 2 } }, { text: 'C. 真愛', scores: { daisy: 5, feiyi: 2, jin: -3 } }, { text: 'D. 女巫', scores: { jin: 5 } }, { text: 'E. 權力', scores: { daisy: 5, jin: 2, feiyi: -3 } }, { text: 'F. 毀滅', scores: { jin: 5, feiyi: 2 } }, { text: 'G. 公主', scores: { feiyi: 5 } }, { text: 'H. 反差', scores: { feiyi: 5, jin: 2 } }, { text: 'I. 後媽', scores: { daisy: 5, jin: 2, feiyi: -3 } }, { text: 'J. 救贖', scores: { feiyi: 5, jin: 2, daisy: -3 } }, { text: 'K. 復仇', scores: { jin: 5 } } ] },
            { type: 'single', title: '步入索多瑪這座瑰麗的都市，最吸引你的景象是？', options: [ { text: 'A. 繁華、名流宴會、議會席位。', scores: { daisy: 10 } }, { text: 'B. 自由、三角關係、假意真心。', scores: { jin: 10 } }, { text: 'C. 墮落、為虎作倀、玷污明月。', scores: { feiyi: 10 } } ] },
            { type: 'single', title: '若將家族比作一個王朝，你預見自己的位階是？', options: [ { text: 'A. 愛權力也愛享樂的野心女皇。', scores: { daisy: 10 } }, { text: 'B. 主宰人們生死的高智國師。', scores: { jin: 10 } }, { text: 'C. 監禁愛人的密探首領。', scores: { feiyi: 10 } } ] },
            { type: 'single', title: '授勳詞像遠古的詛咒或祝福，哪句最觸動你？', options: [ { text: 'A. 權力是強盛的階梯，野心是你的利劍。', scores: { daisy: 10 } }, { text: 'B. 善良與正義是假象，保持心中的光明。', scores: { jin: 10 } }, { text: 'C. 你踩著真心接過了這枚不配擁有的勳章。', scores: { feiyi: 10 } } ] },
            { type: 'single', title: '發現禁忌的多重關係，你如何面對這場火？', options: [ { text: 'A. 我可以接受。', scores: { jin: 10 } }, { text: 'B. 我絕不接受。', scores: { daisy: 15, feiyi: 15, jin: -40 } }, { text: 'C. 我無所謂。', scores: {} } ] },
            { type: 'single', title: '若在審判般的會議中成為眾矢之的，你會？', options: [ { text: 'A. 抗壓強，邏輯合理我就接受。', scores: { feiyi: 20, daisy: -20 } }, { text: 'B. 既不願壓力別人，也不想抗壓。', scores: { jin: 20 } }, { text: 'C. 從來就只有我去施加壓力。', scores: { daisy: 20, feiyi: -20 } } ] },
            { type: 'single', title: '愛的種子在欲望中萌發，你覺得那是？', options: [ { text: 'A. 絞殺別的植物的榕樹。', scores: { daisy: 10 } }, { text: 'B. 玫瑰，但我愛的不止一人。', scores: { jin: 10 } }, { text: 'C. 罌粟，共同沉淪，別拯救我。', scores: { feiyi: 10 } } ] },
            { type: 'single', title: '天秤的兩端是愛情與利益，你的靈魂傾向哪邊？', options: [ { text: 'A. 真正強者不犧牲感受獲取利益。', scores: { daisy: 10 } }, { text: 'B. 愛無法跨越利益，我選利益同頻者。', scores: { jin: 10 } }, { text: 'C. 愛是最大利益，我要當主宰。', scores: { feiyi: 10 } } ] },
            { type: 'single', title: '當因果報應臨頭，索多瑪崩毀時，你的態度是？', options: [ { text: 'A. 這是玩火自焚，我玩得很開心。', scores: { daisy: 10 } }, { text: 'B. 樂見其成，真相終將重現。', scores: { jin: 15 } }, { text: 'C. 前往新居，那裡有我的夢境。', scores: { feiyi: 10 } } ] },
            { type: 'single', title: '親情在你的命運之書中寫著什麼？', options: [ { text: 'A. 親人是上帝選的，但我要自己選。', scores: { daisy: 10 } }, { text: 'B. 這是造物主給我的天然羈絆與珍寶。', scores: { feiyi: 10, jin: 10 } } ] }
        ];

        const today = new Date();
        const YEARS = [today.getFullYear(), today.getFullYear() + 1];
        const MONTHS = Array.from({length: 12}, (_, i) => i + 1);
        const DAYS = Array.from({length: 31}, (_, i) => i + 1);
        const HOURS = Array.from({length: 13}, (_, i) => `${i + 10}:00`);

        function App() {
            const [step, setStep] = useState('landing');
            const [user, setUser] = useState(null);
            const [isMusicPlaying, setIsMusicPlaying] = useState(false);
            const audioRef = useRef(null);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [scores, setScores] = useState({});
            const [selectedOptions, setSelectedOptions] = useState([]);
            const [allResponses, setAllResponses] = useState([]);
            const [loading, setLoading] = useState(false);
            const [dateState, setDateState] = useState({ year: today.getFullYear(), month: today.getMonth() + 1, day: today.getDate() });
            const [userData, setUserData] = useState({ name: '', gender: 'male', gameDate: '', gameTime: '14:00', message: '' });

            const currentQuestions = useMemo(() => userData.gender === 'male' ? QUESTIONS_MALE : QUESTIONS_FEMALE, [userData.gender]);
            const currentQ = useMemo(() => currentQuestions[currentQIndex] || currentQuestions[0], [currentQuestions, currentQIndex]);

            useEffect(() => {
                setUserData(prev => ({ ...prev, gameDate: `${dateState.year}-${String(dateState.month).padStart(2,'0')}-${String(dateState.day).padStart(2,'0')}` }));
            }, [dateState]);

            useEffect(() => {
                const initAuth = async () => {
                    if (!auth) {
                        setUser({ uid: 'local-user' });
                        return;
                    }
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { console.error("Auth error", err); }
                };
                initAuth();
                
                let unsubscribe = () => {};
                if (auth) {
                    unsubscribe = onAuthStateChanged(auth, setUser);
                }
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || step !== 'admin') return;
                if (!db) {
                    setAllResponses([]);
                    return;
                }
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'responses');
                const q = query(colRef);
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Sort by submission timestamp primarily
                    data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    setAllResponses(data);
                }, (err) => console.error("Firestore error:", err));
                return () => unsubscribe();
            }, [user, step]);

            const toggleMusic = () => {
                if (audioRef.current) {
                    if (isMusicPlaying) audioRef.current.pause();
                    else audioRef.current.play();
                    setIsMusicPlaying(!isMusicPlaying);
                }
            };

            const handleStart = () => {
                if (audioRef.current) audioRef.current.play().then(() => setIsMusicPlaying(true)).catch(() => {});
                setStep('info'); window.scrollTo(0, 0);
            };

            const handleOptionClick = (o) => {
                if (currentQ.type === 'single') {
                    const ns = { ...scores };
                    Object.entries(o.scores).forEach(([c, v]) => ns[c] = (ns[c] || 0) + v);
                    setScores(ns);
                    if (currentQIndex < currentQuestions.length - 1) setCurrentQIndex(currentQIndex + 1);
                    else setStep('message');
                    window.scrollTo(0, 0);
                } else {
                    setSelectedOptions(p => p.find(x => x.text === o.text) ? p.filter(x => x.text !== o.text) : [...p, o]);
                }
            };

            const nextMultiStep = () => {
                const ns = { ...scores };
                selectedOptions.forEach(o => Object.entries(o.scores).forEach(([c, v]) => ns[c] = (ns[c] || 0) + v));
                setScores(ns); setSelectedOptions([]);
                if (currentQIndex < currentQuestions.length - 1) setCurrentQIndex(currentQIndex + 1);
                else setStep('message');
                window.scrollTo(0, 0);
            };

            const submitFinal = async () => {
                if (!user) return;
                setLoading(true);
                try {
                    const result = Object.entries(scores).reduce((a, b) => a[1] > b[1] ? a : b)[0];
                    if (db) {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'responses'), { 
                            ...userData, scores, result, timestamp: new Date().toISOString(), uid: user.uid 
                        });
                    } else {
                        console.log("Mock saved result:", result);
                    }
                    setStep('result');
                } catch (error) {
                    console.error("Save error:", error);
                    setStep('result'); // mock proceed
                } finally {
                    setLoading(false);
                    window.scrollTo(0, 0);
                }
            };

            const calculatePercentages = (playerScores) => {
                const sv = Object.values(playerScores);
                const tp = sv.reduce((a, v) => a + Math.max(0, v), 0);
                const res = {};
                Object.entries(playerScores).forEach(([k, v]) => res[k] = tp === 0 ? 33 : Math.round((Math.max(0, v) / tp) * 100));
                return res;
            };

            return (
                <div className="relative min-h-screen">
                    <div className="app-bg"></div>
                    <audio ref={audioRef} src="Lana Del Rey - Young And Beautiful.mp3" loop />
                    
                    <div className="fixed top-6 right-6 z-50 flex items-center gap-3">
                        {step === 'landing' && (
                            <button onClick={() => setStep('admin_login')} className="p-3 glass-panel rounded-full text-white/60 hover:text-white transition-all hover:scale-110 active:scale-95 flex items-center gap-2 group"><Icons.Settings /><span className="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-500 whitespace-nowrap text-xs tracking-widest uppercase">後台結果</span></button>
                        )}
                        <button onClick={toggleMusic} className="p-3 glass-panel rounded-full text-white/60 hover:text-white transition-all hover:scale-110 active:scale-95"><Icons.Music active={isMusicPlaying} /></button>
                    </div>

                    {step === 'landing' && (
                        <div className="min-h-screen flex flex-col items-center py-12 px-6 space-y-16 animate-fade-in text-center">
                            <div className="glass-panel p-12 rounded-3xl max-w-xl w-full space-y-8 shadow-2xl mt-12">
                                <div className="flex justify-center text-yellow-500 animate-pulse"><Icons.Crown /></div>
                                <h1 className="text-6xl font-serif tracking-[0.3em] text-white drop-shadow-lg w-full">溫床</h1>
                                <p className="text-lg text-gray-300 leading-loose tracking-widest">「人總愛在罪惡的溫床裡，尋找一位神。」<br/>權力、欲望、背德與純愛。<br/>星盤轉動，誰將與你的靈魂共鳴？</p>
                                <button onClick={handleStart} className="w-full py-5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-full text-xl font-bold transition-all hover:tracking-widest shadow-xl">進入索多瑪</button>
                                <button onClick={() => setStep('admin_login')} className="text-white/20 text-xs hover:text-white/50 pt-4 flex items-center justify-center gap-1 transition-colors uppercase tracking-[0.2em]"><Icons.Lock /> 命運引路人登入</button>
                            </div>
                            <div className="w-full max-w-6xl space-y-12">
                                <div className="flex flex-col items-center space-y-4 text-center"><div className="flex items-center gap-4 text-white/60 uppercase tracking-[0.5em] text-sm"><div className="hidden md:block w-12 h-[1px] bg-white/20"></div>索多瑪的眾生相<div className="hidden md:block w-12 h-[1px] bg-white/20"></div></div><Icons.Eye /></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {ALL_CHARACTERS.map(char => (
                                        <div key={char.id} className="glass-panel rounded-3xl overflow-hidden group border-white/5 hover:border-white/20 transition-all duration-500 text-left"><div className="relative aspect-[3/4] overflow-hidden"><img src={char.img} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" onError={e=>e.target.src='https://via.placeholder.com/400x600?text='+char.name}/><div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div><div className="absolute bottom-6 left-6 right-6"><h3 className="text-3xl font-serif font-bold text-white tracking-[0.2em]">{char.name}</h3></div></div><div className="p-8"><p className="text-gray-300 text-sm font-light italic leading-relaxed text-left">「{char.quote}」</p></div></div>
                                    ))}
                                </div>
                            </div>
                            <div className="pt-20 pb-10 text-white/10 text-xs tracking-widest uppercase text-center w-full">Sodom's Fate System &copy; Warm Bed</div>
                        </div>
                    )}

                    {step === 'info' && (
                        <div className="min-h-screen flex items-center justify-center p-6 animate-fade-in text-center">
                            <div className="glass-panel p-10 rounded-3xl max-w-md w-full space-y-6">
                                <div className="flex items-center justify-center gap-3 mb-4 border-b border-white/10 pb-4"><Icons.Scroll /><h2 className="text-3xl font-serif text-white tracking-widest">命運契約登記</h2></div>
                                <input type="text" required placeholder="請輸入名諱" className="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white placeholder-white/20 focus:outline-none focus:border-white/40 transition-all text-center" value={userData.name} onChange={e => setUserData({...userData, name: e.target.value})} />
                                <div className="flex gap-4">
                                    <button type="button" onClick={() => setUserData({...userData, gender: 'male'})} className={`flex-1 py-4 rounded-xl border transition-all ${userData.gender === 'male' ? 'bg-blue-600/30 border-blue-400 text-blue-100 shadow-xl' : 'bg-white/5 border-white/10 text-white/30'}`}>男性</button>
                                    <button type="button" onClick={() => setUserData({...userData, gender: 'female'})} className={`flex-1 py-4 rounded-xl border transition-all ${userData.gender === 'female' ? 'bg-pink-600/30 border-pink-400 text-pink-100 shadow-xl' : 'bg-white/5 border-white/10 text-white/30'}`}>女性</button>
                                </div>
                                <div className="space-y-4">
                                    <label className="block text-xs text-white/40 tracking-widest uppercase text-center w-full font-bold">因果交會之時</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        <select className="bg-white/5 border border-white/10 p-3 rounded-xl text-white appearance-none text-center focus:outline-none" value={dateState.year} onChange={e => setDateState({...dateState, year: parseInt(e.target.value)})}>{YEARS.map(y => <option key={y} value={y}>{y}年</option>)}</select>
                                        <select className="bg-white/5 border border-white/10 p-3 rounded-xl text-white appearance-none text-center focus:outline-none" value={dateState.month} onChange={e => setDateState({...dateState, month: parseInt(e.target.value)})}>{MONTHS.map(m => <option key={m} value={m}>{m}月</option>)}</select>
                                        <select className="bg-white/5 border border-white/10 p-3 rounded-xl text-white appearance-none text-center focus:outline-none" value={dateState.day} onChange={e => setDateState({...dateState, day: parseInt(e.target.value)})}>{DAYS.map(d => <option key={d} value={d}>{d}日</option>)}</select>
                                    </div>
                                    <select className="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white appearance-none text-center mt-2 focus:outline-none" value={userData.gameTime} onChange={e => setUserData({...userData, gameTime: e.target.value})}>{HOURS.map(h => <option key={h} value={h}>{h}</option>)}</select>
                                </div>
                                <button onClick={() => setStep('quiz')} className="w-full py-5 bg-white text-black font-bold rounded-xl shadow-2xl hover:bg-gray-100 transition-colors">撥開迷霧</button>
                            </div>
                        </div>
                    )}

                    {step === 'quiz' && (
                        <div className="min-h-screen p-6 animate-fade-in flex flex-col items-center">
                            <div className="max-w-2xl w-full pt-20 space-y-12">
                                <div className="space-y-4 text-left"><div className="h-1.5 bg-white/10 w-full rounded-full overflow-hidden"><div className="h-full bg-white transition-all duration-700 shadow-[0_0_20px_#fff]" style={{ width: `${(currentQIndex / currentQuestions.length) * 100}%` }}></div></div><span className="text-white/30 text-xs tracking-widest font-mono uppercase block w-full text-center font-bold">命運的第 {currentQIndex + 1} 次叩問</span></div>
                                <h2 className="text-4xl font-serif text-white leading-relaxed tracking-wider drop-shadow-lg text-center">{currentQ?.title}</h2>
                                <div className="space-y-4 text-left">{currentQ?.options.map((o, i) => {
                                    const sel = selectedOptions.find(x => x.text === o.text);
                                    return (<button key={i} onClick={() => handleOptionClick(o)} className={`w-full text-left p-6 rounded-2xl glass-panel transition-all duration-300 hover:bg-white/10 group ${sel ? 'bg-white/20 border-white/50 text-white shadow-xl' : 'text-gray-300 border-white/5'}`}><div className="flex items-center justify-between"><span className="text-xl tracking-wide">{o.text}</span>{sel && <div className="animate-pulse"><Icons.ChevronRight /></div>}</div></button>);
                                })}</div>
                                {currentQ?.type === 'multi' && (<button onClick={nextMultiStep} disabled={selectedOptions.length === 0} className="w-full py-5 bg-white text-black rounded-2xl font-bold hover:tracking-widest transition-all disabled:opacity-20 shadow-xl mt-4">確認指引 <Icons.ChevronRight /></button>)}
                            </div>
                        </div>
                    )}

                    {step === 'message' && (
                        <div className="min-h-screen flex items-center justify-center p-6 animate-fade-in text-center">
                            <div className="glass-panel p-10 rounded-3xl max-w-md w-full space-y-8">
                                <div className="flex justify-center text-white/50"><Icons.Skull /></div>
                                <h2 className="text-2xl font-serif text-white tracking-widest">對命運引路人的私語</h2>
                                <textarea className="w-full h-48 bg-white/5 border border-white/10 p-6 rounded-2xl focus:outline-none focus:border-white/30 text-white resize-none placeholder-white/10 text-center" placeholder="寫下你對身份的期許..." value={userData.message} onChange={e => setUserData({...userData, message: e.target.value})} />
                                <button onClick={submitFinal} disabled={loading} className="w-full py-5 bg-white text-black font-bold rounded-2xl text-xl transition-all shadow-2xl flex items-center justify-center gap-2 hover:bg-gray-100 transition-colors">{loading ? '星軌計算中...' : '刻下靈魂契約'} <Icons.ChevronRight /></button>
                            </div>
                        </div>
                    )}

                    {step === 'result' && (() => {
                        const fp = calculatePercentages(scores);
                        const sorted = Object.entries(fp).sort((a,b) => b[1] - a[1]).map(([id, pct]) => ({ ...ALL_CHARACTERS.find(c => c.id === id), pct }));
                        return (
                            <div className="min-h-screen py-20 px-6 overflow-y-auto animate-fade-in flex flex-col items-center text-center">
                                <div className="max-w-6xl w-full space-y-16">
                                    <div className="space-y-4"><h2 className="text-sm font-serif tracking-[1em] text-white/40 uppercase">星軌定論</h2><h1 className="text-5xl font-serif text-white tracking-[0.2em]">靈魂契合報告</h1></div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">
                                        {sorted.map((c, i) => (
                                            <div key={c.id} className={`glass-panel rounded-3xl overflow-hidden transition-all duration-1000 transform animate-fade-in ${i === 0 ? 'destiny-glow scale-105 z-10' : 'opacity-70 grayscale-[30%] hover:grayscale-0 hover:scale-102 hover:opacity-100'}`} style={{ animationDelay: `${i * 0.3}s` }}>
                                                <div className="relative aspect-[3/4] overflow-hidden text-left"><img src={c.img} className="w-full h-full object-cover" onError={e=>e.target.src='https://via.placeholder.com/400x600?text='+c.name}/><div className="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div><div className="absolute top-4 right-4 bg-white text-black px-4 py-1 rounded-full font-serif font-bold text-lg">{c.pct}%</div><div className="absolute bottom-6 left-0 right-0 text-center text-white"><h3 className="text-4xl font-serif font-bold tracking-[0.3em]">{c.name}</h3>{i === 0 && <span className="text-[10px] uppercase tracking-[0.5em] text-yellow-500 font-bold">命定之選</span>}</div></div>
                                                <div className="p-8 space-y-6 text-left"><div className="h-1 w-full bg-white/5 rounded-full overflow-hidden"><div className={`h-full transition-all duration-1000 delay-500 ${i === 0 ? 'bg-white bar-glow' : 'bg-white/40'}`} style={{ width: `${c.pct}%` }}></div></div><p className="text-gray-200 text-sm font-light italic leading-relaxed text-center">「{c.quote}」</p></div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="glass-panel p-10 rounded-3xl max-w-2xl mx-auto space-y-4"><p className="text-white/60 text-sm tracking-widest leading-loose">星軌顯示你的靈魂具有多重切面，<br/>結果已交由「命運引路人」留存。</p><div className="pt-6 border-t border-white/10 text-[10px] text-white/20 tracking-[.5em] uppercase">Fate synchronized to DM.</div></div>
                                </div>
                            </div>
                        );
                    })()}

                    {step === 'admin_login' && (
                        <div className="min-h-screen flex items-center justify-center p-6 animate-fade-in text-center">
                            <div className="glass-panel p-10 rounded-3xl w-full max-w-sm space-y-6 shadow-2xl">
                                <h2 className="text-2xl font-serif text-white tracking-widest uppercase">引路人驗證</h2>
                                <input type="password" id="adminPwd" className="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-center text-white focus:outline-none" placeholder="輸入秘鑰" />
                                <button onClick={() => { if (document.getElementById('adminPwd').value === 'warmbed888') setStep('admin'); else alert('錯誤'); }} className="w-full py-4 bg-white text-black font-bold rounded-xl hover:bg-gray-100 transition-all shadow-xl uppercase tracking-widest">開啟後台</button>
                                <button onClick={() => setStep('landing')} className="w-full text-white/20 text-xs mt-4 tracking-widest uppercase">返回迷霧首頁</button>
                            </div>
                        </div>
                    )}

                    {step === 'admin' && (
                        <div className="min-h-screen p-10 bg-black/90 backdrop-blur-3xl overflow-y-auto animate-fade-in">
                            <div className="max-w-7xl mx-auto space-y-16">
                                <div className="flex justify-between items-end border-b border-white/10 pb-8"><div className="flex items-center gap-4 text-white text-left"><Icons.Settings /><h1 className="text-4xl font-serif tracking-[.2em] uppercase">溫床・天秤觀測台</h1></div><button onClick={() => setStep('landing')} className="text-white/30 text-sm uppercase transition-colors hover:text-white tracking-widest">Logout</button></div>
                                {(() => {
                                    // Group and sort sessions by Date (Latest First)
                                    const grouped = allResponses.reduce((acc, curr) => {
                                        const key = `${curr.gameDate} ${curr.gameTime}`;
                                        if (!acc[key]) acc[key] = [];
                                        acc[key].push(curr);
                                        return acc;
                                    }, {});
                                    const sortedSessionKeys = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
                                    
                                    return sortedSessionKeys.map(key => (
                                        <div key={key} className="space-y-8 text-left animate-fade-in">
                                            <h2 className="text-2xl font-serif text-white/80 flex items-center gap-4"><div className="w-8 h-[1px] bg-white/20"></div> 因果結點：{key}</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                                {grouped[key].map((p, i) => {
                                                    const pcts = calculatePercentages(p.scores);
                                                    return (
                                                        <div key={i} className="glass-panel p-8 rounded-2xl space-y-6 border-white/5 hover:border-white/20 transition-all">
                                                            <div className="flex justify-between items-center text-white"><span className="text-2xl font-bold tracking-wider text-left">{p.name}</span><span className={`px-4 py-1 rounded-full text-[10px] uppercase font-bold ${p.gender === 'male' ? 'bg-blue-500/20 text-blue-300' : 'bg-pink-500/20 text-pink-300'}`}>{p.gender === 'male' ? '男' : '女'}</span></div>
                                                            <div className="space-y-3">
                                                                <div className="text-[10px] text-white/40 tracking-[0.2em] uppercase border-b border-white/10 pb-1 mb-2">靈魂適配佔比</div>
                                                                {Object.entries(pcts).sort((a,b)=>b[1]-a[1]).map(([sid, pct], j) => {
                                                                    const char = ALL_CHARACTERS.find(c=>c.id===sid);
                                                                    return (
                                                                        <div key={sid} className={`flex justify-between items-center text-xs ${j === 0 ? 'text-white font-bold' : 'text-white/30'}`}>
                                                                            <span>{char?.name || sid}</span>
                                                                            <div className="flex-1 border-b border-white/5 mx-4 border-dotted opacity-20"></div>
                                                                            <span>{pct}%</span>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                            {p.message && <div className="text-[11px] text-gray-300 bg-white/5 p-4 rounded-xl italic leading-relaxed text-left border border-white/5">💬 引路人私語：「{p.message}」</div>}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ));
                                })()}
                                {allResponses.length === 0 && <div className="text-center py-40 text-white/10 text-4xl font-serif tracking-widest uppercase w-full">No Records Found</div>}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
